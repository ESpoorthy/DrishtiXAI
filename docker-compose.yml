version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: drishti-db
    environment:
      POSTGRES_USER: drishti_user
      POSTGRES_PASSWORD: drishti_password
      POSTGRES_DB: drishti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti_user -d drishti_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drishti-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drishti-backend
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://drishti_user:drishti_password@db:5432/drishti_db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-jwt-secret-in-production}
      - DEMO_MODE=true
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - upload_data:/app/data/uploads
      - model_weights:/app/models
      - app_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - drishti-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: drishti-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=DrishtiXAI
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - drishti-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
  model_weights:
    driver: local
  app_logs:
    driver: local

networks:
  drishti-network:
    driver: bridge
